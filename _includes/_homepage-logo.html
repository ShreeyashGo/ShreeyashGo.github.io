<div class="dock-item">
    <img src="{{ include.item.image | relative_url }}" alt="{{ include.item.name | escape }}" class="dock-logo{% if include.item.image_class %} {{ include.item.image_class | escape }}{% endif %}"{% if include.item.hide_on_error %} onerror="this.style.display='none'"{% endif %}>
    <div class="dock-tooltip">{{ include.item.description | escape }}</div>
</div>
