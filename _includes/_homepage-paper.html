<article class="research-preview">
    <span class="paper-type">{{ include.paper.type }}</span>
    <h3><a href="{{ include.paper.paper_link }}" target="_blank" rel="noopener noreferrer">{{ include.paper.title }}</a></h3>
    <p>{{ include.paper.homepage_summary }}</p>
    <span class="paper-venue">{{ include.paper.venue }}</span>
    <a class="preview-link" href="{{ include.paper.paper_link }}" target="_blank" rel="noopener noreferrer">Read paper <span aria-hidden="true">↗</span></a>
</article>
